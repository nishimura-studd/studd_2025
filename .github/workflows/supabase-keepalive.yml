name: Supabase Keep Alive

on:
  schedule:
    # 毎日午前9時（UTC）に実行 = 日本時間午後6時
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write # keepaliveコミットのpushに必要

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "🔄 Supabase Keep Alive 開始: $(date -u)"
          
          # worksテーブルへの軽量クエリでスリープ回避
          echo "📊 works テーブルをチェック中..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/rest/v1/works?select=id&limit=1")
          
          echo "HTTP Status: $http_code"
          
          if [ "$http_code" = "200" ]; then
            echo "🎉 Supabase Keep Alive 成功！"
          else
            echo "💥 Keep Alive 失敗 (HTTP $http_code)"
            exit 1
          fi

      - name: Prevent Workflow Auto-Disable
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_DAYS: 50
        run: |
          # GitHubはパブリックリポジトリで60日間活動がないとscheduleを自動無効化する。
          # しきい値を超えたらタイムスタンプを更新してコミットし、カウンタをリセットする。
          pushed_at=$(gh api "repos/$GITHUB_REPOSITORY" --jq .pushed_at)
          idle_days=$(( ( $(date -u +%s) - $(date -u -d "$pushed_at" +%s) ) / 86400 ))
          
          echo "🕒 最終push: $pushed_at（${idle_days}日前 / しきい値 ${THRESHOLD_DAYS}日）"
          
          if [ "$idle_days" -lt "$THRESHOLD_DAYS" ]; then
            echo "✅ まだ活動が新しいためkeepaliveコミットは不要"
            exit 0
          fi
          
          echo "⚠️ 自動無効化が近いためkeepaliveコミットを作成"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: keepalive commit to keep scheduled workflow enabled"
          git push
          echo "🚀 keepaliveコミットをpushしました"

      - name: Log Execution
        if: always()
        run: |
          echo "📅 Keep-alive実行完了: $(date -u)"
          echo "⏰ 次回実行予定: 24時間後"
          echo "🌐 監視対象: Supabase REST API直接アクセス"
